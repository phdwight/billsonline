services:
  app:
    image: ghcr.io/phdwight/billsonline:latest
    pull_policy: always
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      - app-data:/app/instance
    restart: unless-stopped

volumes:
  app-data:
