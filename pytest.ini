[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# BDD settings
bdd_features_base_dir = tests/features

# Markers
markers =
    bdd: marks tests as behavior-driven development tests
    ui: marks tests as UI/browser tests using Playwright
    smoke: Playwright smoke tests against a deployed local container (needs SMOKE_BASE_URL)
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    components: UI tests for bill components
    readings: UI tests for meter readings
    months: UI tests for monthly bills
    navigation: UI tests for page navigation
    participants: UI tests for participant management
    settings: UI tests for settings page

# Playwright settings (via pytest-playwright)
# Run headless by default, use --headed for debugging
# Use --browser chromium/firefox/webkit to switch browsers

# Logging
log_cli = true
log_cli_level = INFO
