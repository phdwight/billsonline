{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2 class="section-title">Edit Month {{ bill.year }}-{{ '%02d'|format(bill.month) }}</h2>
  <form method="post" class="stack">
    {{ form.csrf_token }}
    <label>Electricity Amount {{ form.electricity_amount(step='0.01', required=True) }}</label>
    <label>Water Amount {{ form.water_amount(step='0.01', required=True) }}</label>
    <label>Internet Amount {{ form.internet_amount(step='0.01', required=True) }}</label>
    <div style="display:flex; gap:.5rem; align-items:center;">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-secondary" href="{{ url_for('main.month_detail', bill_id=bill.id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
