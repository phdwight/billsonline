<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bills Online</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header>
      <div class="container">
        <div class="brand"><span class="logo"></span> Bills Online</div>
        <nav>
          <a href="{{ url_for('main.index') }}">Home</a>
          <a href="{{ url_for('main.participants_page') }}">Participants</a>
          <a href="{{ url_for('main.archived') }}">Archived</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <ul class="flashes">
        {% for category, message in messages %}
          <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
      </div>
    </main>
  </body>
  </html>
