{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-header">
    <h2 class="section-title">👥 Manage Participants</h2>
    <a href="{{ url_for('home.index') }}" class="btn btn-secondary btn-sm"><svg class="icon icon-left"><use href="#icon-back"/></svg>Back</a>
  </div>
  
  <div class="participant-edit-list">
    {% for p in participants %}
    <form method="post" action="{{ url_for('participants.update', pid=p.id) }}" class="participant-edit-row">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <span class="participant-avatar">{{ p.name[0].upper() }}</span>
      <div class="input-with-button">
        <input type="text" name="name" value="{{ p.name }}" required>
        <button type="submit" class="btn btn-primary btn-icon" title="Save changes">✓</button>
      </div>
    </form>
    {% else %}
    <div class="empty-state">No participants yet. Add one from the home page.</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
